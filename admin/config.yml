backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:

  - name: "settings"
    label: "📝 サイト文言設定"
    files:
      - name: "site"
        label: "サイト全体の文言"
        file: "content/settings/site.json"
        fields:
          - { label: "ビジョン見出し（改行可）", name: "vision_heading", widget: "text" }
          - { label: "ビジョン本文①", name: "vision_p1", widget: "text" }
          - { label: "ビジョン本文②", name: "vision_p2", widget: "text" }
          - label: "ファウンダー"
            name: "founders"
            widget: "list"
            summary: "{{fields.name}} ／ {{fields.role}}"
            fields:
              - { label: "氏名", name: "name", widget: "string" }
              - { label: "肩書き", name: "role", widget: "string" }
              - { label: "写真（未設定なら👤）", name: "image", widget: "image", required: false }
          - { label: "構想 見出し（改行可）", name: "concept_heading", widget: "text" }
          - { label: "構想 本文①", name: "concept_p1", widget: "text" }
          - { label: "構想 本文②", name: "concept_p2", widget: "text" }
          - { label: "構想 本文③", name: "concept_p3", widget: "text" }
          - { label: "構想 写真", name: "concept_image", widget: "image" }
          - { label: "連携先 説明文（改行可）", name: "partners_lead", widget: "text" }
          - { label: "お問い合わせ 見出し（改行可）", name: "cta_heading", widget: "text" }
          - { label: "お問い合わせ 説明文", name: "cta_sub", widget: "text" }
          - { label: "お問い合わせ先メールアドレス", name: "cta_email", widget: "string" }
          - { label: "フッター サブタイトル", name: "footer_sub", widget: "string" }
          - { label: "コピーライト", name: "footer_copyright", widget: "string" }

      - name: "slides"
        label: "🖼 ビジョン左右の写真"
        file: "content/settings/slides.json"
        fields:
          - name: "left"
            label: "左側の写真（スライドショー）"
            widget: "list"
            fields:
              - { label: "写真", name: "image", widget: "image" }
              - { label: "説明（alt）", name: "alt", widget: "string" }
          - name: "right"
            label: "右側の写真（スライドショー・スマホでは非表示）"
            widget: "list"
            fields:
              - { label: "写真", name: "image", widget: "image" }
              - { label: "説明（alt）", name: "alt", widget: "string" }

  - name: "members"
    label: "👥 メンバー（現在トップページ非表示）"
    folder: "content/members"
    create: true
    format: "json"
    slug: "{{slug}}"
    summary: "{{title}} ／ {{role}}"
    fields:
      - { label: "氏名", name: "title", widget: "string" }
      - { label: "役職・肩書き", name: "role", widget: "string" }
      - { label: "専門・工芸", name: "craft", widget: "string" }
      - { label: "プロフィール写真", name: "image", widget: "image", required: false }
      - { label: "紹介文", name: "bio", widget: "text", required: false }
      - { label: "表示順（小さい数字が先）", name: "order", widget: "number", default: 99 }
      - { label: "掲載中", name: "active", widget: "boolean", default: true }

  - name: "activities"
    label: "🗂 活動・実績"
    folder: "content/activities"
    create: true
    format: "json"
    slug: "{{year}}-{{slug}}"
    summary: "{{date}} ／ {{title}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "時期（例：2025年4月）", name: "date", widget: "string" }
      - { label: "場所（例：ミラノ）", name: "location", widget: "string", required: false }
      - { label: "種別", name: "type", widget: "select",
          options: ["展示会","イベント","連携","メディア掲載"] }
      - { label: "サムネイル", name: "image", widget: "image", required: false }
      - { label: "説明文", name: "body", widget: "text" }
      - { label: "優先して表示（トップには最新3件・1件目が大きく表示）", name: "featured", widget: "boolean", default: false }

  - name: "news"
    label: "📰 ニュース・記事"
    folder: "content/news"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} ／ {{title}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付", name: "date", widget: "datetime" }
      - { label: "カテゴリ", name: "category", widget: "select",
          options: ["展示会","マルシェ","メディア掲載","連携・協定","お知らせ","活動レポート"] }
      - { label: "サムネイル", name: "image", widget: "image", required: false }
      - { label: "本文", name: "body", widget: "markdown", required: false }
      - { label: "リンク先URL（任意）", name: "link", widget: "string", required: false }
      - { label: "公開", name: "published", widget: "boolean", default: true }

  - name: "partners"
    label: "🤝 連携先"
    folder: "content/partners"
    create: true
    format: "json"
    slug: "{{slug}}"
    summary: "{{title}} ／ {{subtitle}}"
    fields:
      - { label: "名称（大きく表示）", name: "title", widget: "string" }
      - { label: "正式名称など（小さく表示）", name: "subtitle", widget: "string", required: false }
      - { label: "ロゴ画像（任意）", name: "logo", widget: "image", required: false }
      - { label: "リンク先URL（任意）", name: "url", widget: "string", required: false }
      - { label: "表示順（小さい数字が先）", name: "order", widget: "number", default: 99 }
